<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RAUM R*</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .room {
    border: 1px solid #555;
    padding: 20px 30px;
    border-radius: 8px;
    min-width: 260px;
    text-align: center;
    background: #181818;
  }
  .state {
    font-size: 18px;
    margin-bottom: 10px;
  }
  .move {
    margin-top: 15px;
    font-size: 14px;
    opacity: 0.8;
  }
  button {
    margin-top: 15px;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    background: #444;
    color: #eee;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="room">
  <div class="state" id="state">s* = aktueller Raum</div>
  <div class="move" id="move">m = RAW (noch nicht gesetzt)</div>
  <button onclick="setMove()">RAW‑Move setzen</button>
</div>

<script>
  let state = "s*";
  let moveRaw = null;

  function setMove() {
    moveRaw = prompt("m_raw eingeben:", "");
    if (moveRaw === null) return;
    document.getElementById("move").innerText = "m = " + moveRaw;
    // hier könnte F(s, m) implementiert werden
    // aktuell nur Anzeige → Referenzraum, kein Logikdruck
  }
</script>

</body>
</html>
