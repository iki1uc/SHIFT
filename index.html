<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>WÜRFEL · OUTPUT</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #output {
    width: 420px;
    height: 260px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 14px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-line;
  }
  button {
    margin-top: 12px;
    padding: 8px 14px;
    background: #444;
    color: #eee;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background:#666; }
</style>
</head>
<body>

<div>
  <div id="output">WÜRFEL bereit.\nWarte auf Vorgang…</div>
  <button onclick="simulate()">VORGANG STARTEN</button>
</div>

<script>
function log(text) {
  const out = document.getElementById("output");
  out.innerText += "\n" + text;
  out.scrollTop = out.scrollHeight;
}

// WÜRFEL-STRATEGIE (vereinfacht, aber echt)
let cube = {
  alt: "ALT-Zustand: stabil, funktional besser",
  now: "JETZT-Zustand: komplex, überladen",
  delta: 0
};

function simulate() {
  log("• Action Replay aktiviert → ALT wird Basis");
  cube.now = cube.alt;

  log("• Würfel stabilisiert (STB)");
  log("• Würfel analysiert Delta…");

  cube.delta = Math.floor(Math.random() * 3) + 1;

  log("• UFR: Evolution +" + cube.delta);
  log("• Neuer Zustand aktiv");
}
</script>

</body>
</html>
