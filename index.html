<body>

    <!-- KI-Meldung -->
    <div id="kiMessage"></div>

    <!-- Cubes zum Anklicken -->
    <div class="cube-button" onclick="activateCube('CUBE_1')">CUBE_1</div>
    <div class="cube-button" onclick="activateCube('CUBE_3')">CUBE_3</div>

    <!-- Counter für CUBE_1 -->
    <div class="cube-counter" id="CUBE_1_COUNTERS">
        <div class="counter-row">
            <span>A:</span><span id="CUBE_1_A">0</span>
        </div>
        <div class="counter-row">
            <span>B:</span><span id="CUBE_1_B">0</span>
        </div>
    </div>

    <!-- Counter für CUBE_3 -->
    <div class="cube-counter" id="CUBE_3_COUNTERS">
        <div class="counter-row">
            <span>A:</span><span id="CUBE_3_A">0</span>
        </div>
        <div class="counter-row">
            <span>B:</span><span id="CUBE_3_B">0</span>
        </div>
    </div>

    <script>
        function activateCube(cubeId) {
            // alle Counter ausblenden
            document.querySelectorAll('.cube-counter')
                    .forEach(el => el.style.display = 'none');

            // nur diesen Cube anzeigen
            document.getElementById(cubeId + "_COUNTERS").style.display = 'block';

            // ON-FLY KI-Check
            onFlyCheck(cubeId);
        }

        function onFlyCheck(cubeId) {
            // hier später echte Logik (Ebene/Faktor/Dimension)
            let compatible = true;

            if (compatible) {
                showKI("ready – 4ALL kompatibel");
                incCounter(cubeId, "A");
                incCounter(cubeId, "B");
            } else {
                showKI("not ready – 4ALL nicht kompatibel");
            }
        }

        function incCounter(cubeId, type) {
            let el = document.getElementById(cubeId + "_" + type);
            el.innerText = parseInt(el.innerText) + 1;
        }

        function showKI(msg) {
            let box = document.getElementById("kiMessage");
            box.innerText = msg;
            box.style.display = "block";
        }
    </script>
</body>

<style>
/* HUD oben */
#modeBar {
    position: fixed;
    top: 10px;

    background: rgba(0,0,0,0.55);
    padding: 8px 12px;

}

.mode { font-weight: bold; }
.red { color: #ff3b3b; }
.green { color: #00ff6a; }
.blue { color: #00c8ff; }

#activeMode {
    margin-left: 20px;

    color: #ffd000;
}

/* 3×3 Maske unten */
#mask3x3 {
    position: fixed;
    bottom: 10px;
    left: 10px;
    display: grid;
    grid-template-columns: repeat(3, 40px);
    grid-gap: 4px;
    z-index: 9999;
}

#mask3x3 .row div {
    width: 40px;
    height: 40px;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: monospace;
    border-radius: 4px;
}

/* Farben pro Reihe */
#mask3x3 .row:nth-child(1) div { background: rgba(255,0,0,0.45); }
#mask3x3 .row:nth-child(2) div { background: rgba(0,150,255,0.45); }
#mask3x3 .row:nth-child(3) div { background: rgba(0,255,100,0.45); }
</style>
<script>

// Beispiel: aktueller Cube
let currentCube = {
    id: "CUBE_3",
    ebene: 3,
    dimension: 144
};

let currentProject = "RESPONDARY";

/* Tastensteuerung */
document.addEventListener("keydown", (e) => {
    if (e.key === "r") activateMode("RAW_WAR");
    if (e.key === "s") activateMode("SAFE");
    if (e.key === "f") activateMode("4ALL");
});

/* Modus aktivieren */
function activateMode(mode) {
    const active = document.getElementById("activeMode");
    active.innerText = "AKTIV: " + mode;

    if (mode === "RAW_WAR") active.style.color = "#ff3b3b";
    if (mode === "SAFE") active.style.color = "#00ff6a";
    if (mode === "4ALL") active.style.color = "#00c8ff";

    if (mode === "4ALL") {
        fillMask(currentCube.ebene, currentCube.dimension, currentProject);
    }
}

/* Maske füllen */
function fillMask(ebene, dim, project) {
    m1.innerText = ebene;
    m5.innerText = dim;
    m9.innerText = project;
}

/* CUBE_0 macht NICHT mit */
function setCube(cubeId) {
    if (cubeId === "CUBE_0") {
        document.getElementById("mask3x3").style.display = "none";
        document.getElementById("modeBar").style.display = "none";
    } else {
        document.getElementById("mask3x3").style.display = "grid";
        document.getElementById("modeBar").style.display = "block";
    }
}

</script>
