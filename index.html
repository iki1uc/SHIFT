<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>?Trihundertvier NoN 144</title>
  <style>
    body { font-family: sans-serif; background:#111; color:#eee; padding:20px; }
    h1 { margin-bottom: 10px; }
    .row { display:flex; justify-content:space-between; padding:6px 10px; margin:4px 0; border-radius:4px; }
    .label { width:180px; }
    .value { width:160px; text-align:right; }
    .status { width:260px; text-align:right; font-size:0.9em; opacity:0.8; }
    .green { background:#123c1a; }
    .yellow { background:#3c3a12; }
    .orange { background:#3c2612; }
    .red { background:#3c1212; }
    .inputs { margin-top:15px; font-size:0.9em; }
    .inputs label { display:block; margin:4px 0; }
    input[type="number"] { width:80px; }
  </style>
</head>
<body>

<h1>?Trihundertvier NoN 144</h1>

<div id="row-stab" class="row">
  <div class="label">[6] Projekt-Stabilität</div>
  <div class="value" id="val-stab"></div>
  <div class="status" id="stat-stab"></div>
</div>

<div id="row-mach" class="row">
  <div class="label">[9] Projekt-Machbarkeit</div>
  <div class="value" id="val-mach"></div>
  <div class="status" id="stat-mach"></div>
</div>

<div id="row-final" class="row">
  <div class="label">[8] Projekt-Final</div>
  <div class="value" id="val-final"></div>
  <div class="status" id="stat-final"></div>
</div>

<div id="row-harm" class="row">
  <div class="label">[8] Projekt-Harmonie</div>
  <div class="value" id="val-harm"></div>
  <div class="status" id="stat-harm"></div>
</div>

<div id="row-rett" class="row">
  <div class="label">[6] Projekt-Rettung (?)</div>
  <div class="value" id="val-rett"></div>
  <div class="status" id="stat-rett"></div>
</div>

<div id="row-gesamt" class="row">
  <div class="label">[9] Gesamt-Status</div>
  <div class="value" id="val-gesamt"></div>
  <div class="status" id="stat-gesamt"></div>
</div>

<div class="inputs">
  <h3>Eingaben</h3>
  <label>Stabilität (%) <input id="in-stab" type="number" min="0" max="100" value="78"></label>
  <label>Machbarkeit (0–3) <input id="in-mach" type="number" min="0" max="3" value="3"></label>
  <label>Final (%) <input id="in-final" type="number" min="0" max="100" value="62">
