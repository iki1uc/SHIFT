<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CUBE3 · Eingabe / Ausgabe + MA³³ Zoom</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 760px;
  }
  .box {
    background: #181818;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 16px;
  }
  #input {
    width: 100%;
    padding: 8px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
  }
  #output {
    height: 180px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px;
    overflow-y: auto;
    white-space: pre-line;
  }
  .ma-zoom {
    height: 160px;
    background: url('ma3zoom.png') center/cover no-repeat;
    border-radius: 8px;
    border: 1px solid #555;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- EINGABE -->
  <div class="box">
    <h3>4user</h3>
    <input id="input" placeholder="ANF 1 / STB 2 / UFR 3 …">
  </div>

  <!-- AUSGABE -->
  <div class="box">
    <h3>4me</h3>
    <div id="output">Bereit.</div>
  </div>

  <!-- MA³³ ZOOM -->
  <div class="box" style="grid-column: 1 / 3;">
    <h3>MA³³ · Zoom-Fenster (rein)</h3>
    <div class="ma-zoom"></div>
  </div>

</div>

<script>
let lvl = 0;

function log(t) {
  const out = document.getElementById("output");
  out.innerText += "\n" + t;
  out.scrollTop = out.scrollHeight;
}

document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const val = e.target.value.trim();
    if (!val) return;

    const [cmd, numRaw] = val.split(" ");
    const num = parseInt(numRaw) || 1;
    const C = cmd.toUpperCase();

    if (["ANF", "STB", "UFR"].includes(C)) {
      lvl += num;
      log("• " + C + " +" + num + " → LEVEL " + lvl);
    } else {
      log("• Unbekannter Move: " + val);
    }

    e.target.value = "";
  }
});
</script>

</body>
</html>
