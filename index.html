<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>index</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f5f5; 
            padding: 40px; 
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            border: none;
            background: black;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Start</h2>
    <p>Klick und gut.</p>
    <button onclick="go()">GO</button>
</div>

<script>
function go() {
    alert("läuft.");
}
</script>

</body>
</html>
