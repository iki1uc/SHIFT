<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>nanoWÜRFEL</title>
  <style>
    body {
      background:#000;
      color:#0f0;
      font-family: monospace;
      padding:2rem;
    }
    input {
      width:100%;
      padding:0.5rem;
      background:#111;
      border:1px solid #0f0;
      color:#0f0;
    }
    button {
      margin-top:0.5rem;
      padding:0.5rem;
      background:#0f0;
      color:#000;
      border:none;
      cursor:pointer;
    }
    #out {
      margin-top:1rem;
      padding:1rem;
      border:1px solid #0f0;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>

  <h1>nanoWÜRFEL</h1>

  <input id="in" placeholder="Action oder Move…" onkeydown="if(event.key==='Enter') run()">
  <button onclick="run()">OK</button>

  <div id="out">bereit</div>

  <script>
    let STATE = 0;

    function run() {
      const v = document.getElementById('in').value.trim();
      if (v === "") {
        document.getElementById('out').textContent = "kein Input";
        return;
      }

      // ACTION erkennung
      if (v.toLowerCase().startsWith("action")) {
        document.getElementById('out').textContent = "ACTION: " + v;
        return;
      }

      // MOVE / STATE Logik
      STATE = (STATE + 1) % 3;
      const states = ["neutral", "aktiv", "fokus"];

      document.getElementById('out').textContent =
        "STATE: " + states[STATE] + "\nMOVE: " + v;
    }
  </script>

</body>
</html>
