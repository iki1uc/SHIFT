<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>1/4 – cubes (minimal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: .75rem;
    }
    p {
      font-size: .9rem;
      margin-bottom: 1.25rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
    button {
      padding: .75rem 1rem;
      font-size: .95rem;
      border-radius: .4rem;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
    }
    button:active {
      transform: translateY(1px);
    }
    .log {
      margin-top: 1.25rem;
      font-size: .8rem;
      min-height: 1.2rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>System 1/4 – cubes</h1>
    <p>Alles weiß, fast nichts nutzbar – aber es lädt, reagiert und zeigt Fehler, falls welche da sind.</p>

    <div class="options">
      <button onclick="selectMode('SAFE / REAL‑MODE')">
        Option 1: SAFE / REAL‑MODE
      </button>
      <button onclick="selectMode('RAW‑WAR / STRESS')">
        Option 2: RAW‑WAR / STRESS
      </button>
    </div>

    <div class="log" id="log">kein Modus gewählt.</div>
  </div>

  <script>
    function selectMode(mode) {
      const log = document.getElementById('log');
      log.textContent = 'gewählt: ' + mode + ' (funktioniert noch, aber macht absichtlich nichts weiter).';
      // hier später echte Logik einbauen – aktuell nur „lebt, aber nutzlos“
    }
  </script>
</body>
</html>
