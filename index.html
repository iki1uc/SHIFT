<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>nanoWÜRFEL</title>
</head>
<body>

<input id="in" placeholder="Input…" onkeydown="if(event.key==='Enter') run()">

<div id="out">bereit</div>

<script>
  let STATE = 0;

  function run() {
    const v = document.getElementById('in').value.trim();
    const out = document.getElementById('out');

    if (v === "") {
      out.textContent = "#EMPTY";
      return;
    }

    // ACTION
    if (v.toLowerCase().startsWith("action")) {
      out.textContent = "#ACTION → " + v;
      return;
    }

    // MOVE / STATE
    STATE = (STATE + 1) % 3;
    const s = ["neutral", "aktiv", "fokus"];

    out.textContent = "#STATE " + s[STATE] + " | MOVE: " + v;
  }
</script>

</body>
</html>
