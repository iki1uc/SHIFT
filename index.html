<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CUBE · Fokus + MA³</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .wrap {
    display: flex;
    gap: 14px;
  }
  .panel {
    width: 420px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 20px;
  }
  #input {
    width: 100%;
    padding: 8px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  #output {
    height: 180px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px;
    overflow-y: auto;
    white-space: pre-line;
    font-size: 14px;
  }
  .ma {
    width: 180px;
    background: #202020;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    white-space: pre-line;
  }
  button {
    margin-top: 10px;
    padding: 8px 14px;
    background: #444;
    color: #eee;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background:#666; }
</style>
</head>
<body>

<div class="wrap">

  <!-- CUBE-RAUM -->
  <div class="panel">
    <input id="input" placeholder="ANF 1 / STB 2 / UFR 3 …">
    <button onclick="run()">OK</button>
    <div id="output">Bereit.</div>
  </div>

  <!-- MA³ MINI-SICHT -->
  <div class="ma" id="ma3">
    MA³ bereit.
  </div>

</div>

<script>
let lvl = 0;

function log(t) {
  const out = document.getElementById("output");
  out.innerText += "\n" + t;
  out.scrollTop = out.scrollHeight;

  // usemeX4 → MA³
  document.getElementById("ma3").innerText = "MA³:\n" + t;
}

function run() {
  const val = document.getElementById("input").value.trim();
  if (!val) return;

  const parts = val.split(" ");
  const cmd = parts[0].toUpperCase();
  const num = parseInt(parts[1]) || 1;

  if (cmd === "ANF" || cmd === "STB" || cmd === "UFR") {
    lvl += num;
    log("• " + cmd + " +" + num + " → LEVEL " + lvl);
  } else {
    log("• Unbekannter Move: " + val);
  }

  document.getElementById("input").value = "";
}
</script>

</body>
</html>
